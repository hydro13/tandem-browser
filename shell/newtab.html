<!DOCTYPE html>
<html lang="nl">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; media-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <!-- Pre-paint theme stamp for webview-loaded shell pages.
       The main BrowserWindow gets the theme via preload+additionalArguments,
       but webviews don't inherit that path — so we do a tiny sync XHR here to
       stamp data-theme before the inline <style> blocks are processed by the
       parser. Sync XHR is deprecated (console warning), but it's the only way
       to avoid a dark→light flash. Fails silently if the API isn't up. -->
  <script src="js/api-base.js"></script>
  <script src="js/theme-stamp.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <script type="module" src="js/theme.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --surface-hover: #1a2744;
      --text: #eee;
      --text-dim: #888;
      --text-muted: #555;
      --accent: #e94560;
      --border: #0f3460;
      --links-title: #6f7692;
      --links-action-border: #28416d;
      --links-action-bg: rgba(22, 33, 62, 0.88);
      --links-action-color: #c8cfdf;
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-hover: #f1f5f9;
      --text: #1e293b;
      --text-dim: #64748b;
      --text-muted: #94a3b8;
      --accent: #e94560;
      --border: rgba(0,0,0,0.08);
      --links-title: #94a3b8;
      --links-action-border: rgba(0,0,0,0.12);
      --links-action-bg: rgba(255,255,255,0.9);
      --links-action-color: #475569;
    }

    @media (prefers-color-scheme: light) {
      [data-theme="system"] {
        --bg: #f8fafc;
        --surface: #ffffff;
        --surface-hover: #f1f5f9;
        --text: #1e293b;
        --text-dim: #64748b;
        --text-muted: #94a3b8;
        --accent: #e94560;
        --border: rgba(0,0,0,0.08);
        --links-title: #94a3b8;
        --links-action-border: rgba(0,0,0,0.12);
        --links-action-bg: rgba(255,255,255,0.9);
        --links-action-color: #475569;
      }
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 0.5vh 20px 40px;
    }

    .logo-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 32px;
    }

    .logo-bg {
      width: 700px;
      height: auto;
      opacity: 0.45;
      pointer-events: none;
      user-select: none;
    }

    .logo {
      font-size: 48px;
      font-weight: 700;
      margin-top: -45px;
      letter-spacing: -1px;
      position: relative;
      z-index: 1;
    }

    .logo span { color: #e94560; }

    .subtitle {
      color: var(--text-dim);
      font-size: 14px;
      position: relative;
      z-index: 1;
    }

    .search-box {
      width: 100%;
      max-width: 560px;
      position: relative;
      margin-bottom: 40px;
    }

    .search-box input {
      width: 100%;
      padding: 14px 20px;
      padding-left: 44px;
      font-size: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .search-box input::placeholder {
      color: var(--text-muted);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 18px;
      pointer-events: none;
    }

    .quick-links {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      max-width: 560px;
      margin-bottom: 48px;
    }

    .quick-links-wrap {
      width: 100%;
      max-width: 560px;
      margin-bottom: 48px;
    }

    .quick-links-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .quick-links-title {
      font-size: 12px;
      color: var(--links-title);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .quick-links-action {
      border: 1px solid var(--links-action-border);
      background: var(--links-action-bg);
      color: var(--links-action-color);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, transform 0.2s;
    }

    .quick-links-action:hover {
      color: var(--text);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .quick-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: var(--text-dim);
      font-size: 11px;
      width: 72px;
      transition: color 0.2s;
    }

    .quick-link:hover { color: var(--text); }

    .quick-link .icon {
      width: 48px;
      height: 48px;
      background: var(--surface);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      transition: background 0.2s;
    }

    .quick-link:hover .icon {
      background: var(--surface-hover);
    }

    .quick-link img {
      width: 24px;
      height: 24px;
      border-radius: 4px;
    }

    .quick-link-fallback {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      background: rgba(233, 69, 96, 0.16);
      color: #f2b1bc;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .quick-links-empty {
      color: var(--text-muted);
      font-size: 13px;
      padding: 12px 0;
      text-align: center;
      width: 100%;
    }

    .recent-section {
      width: 100%;
      max-width: 560px;
    }

    .recent-section h3 {
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .recent-tabs {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .recent-tab {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: var(--surface);
      border-radius: 8px;
      text-decoration: none;
      color: var(--text-dim);
      font-size: 13px;
      transition: background 0.2s;
    }

    .recent-tab:hover { background: var(--surface-hover); color: var(--text); }

    .recent-tab img {
      width: 16px;
      height: 16px;
      border-radius: 2px;
    }

    .recent-tab .url {
      color: var(--text-muted);
      font-size: 11px;
      margin-left: auto;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <script src="js/api-auth.js"></script>
  <div class="logo-wrap">
    <img class="logo-bg" src="tandem-bike.png" alt="">
    <div class="logo"><span>T</span>andem</div>
    <div class="subtitle">Co-Pilot Browser</div>
  </div>

  <div class="search-box">
    <span class="search-icon">&#x1F50D;</span>
    <input type="text" id="search" placeholder="Search or type a URL..." autofocus>
  </div>

  <div class="quick-links-wrap">
    <div class="quick-links-header">
      <div class="quick-links-title">Quick links</div>
      <button type="button" class="quick-links-action" id="edit-quick-links">Edit Quick Links</button>
    </div>

    <div class="quick-links" id="quick-links">
      <div class="quick-links-empty">Loading shortcuts...</div>
    </div>
  </div>

  <div class="recent-section">
    <h3>Recent tabs</h3>
    <div class="recent-tabs" id="recent-tabs">
      <div style="color: var(--text-muted); font-size: 13px; padding: 8px;">Loading...</div>
    </div>
  </div>

  <script src="js/pages/newtab.js"></script>
</body>
</html>

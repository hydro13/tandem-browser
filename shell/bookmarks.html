<!DOCTYPE html>
<html lang="nl">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; media-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <!-- Pre-paint theme stamp for webview-loaded shell pages.
       The main BrowserWindow gets the theme via preload+additionalArguments,
       but webviews don't inherit that path — so we do a tiny sync XHR here to
       stamp data-theme before the inline <style> blocks are processed by the
       parser. Sync XHR is deprecated (console warning), but it's the only way
       to avoid a dark→light flash. Fails silently if the API isn't up. -->
  <script src="js/api-base.js"></script>
  <script src="js/theme-stamp.js"></script>
  <script src="js/html-escape.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmarks</title>
  <script type="module" src="js/theme.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --surface2: #1c2a4a;
      --surface-hover: #1a2744;
      --accent: #e94560;
      --text: #eee;
      --text-dim: #888;
      --text-muted: #555;
      --border: rgba(255,255,255,0.06);
      --input-bg: #0f3460;
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface2: #f1f5f9;
      --surface-hover: #e2e8f0;
      --accent: #e94560;
      --text: #1e293b;
      --text-dim: #64748b;
      --text-muted: #94a3b8;
      --border: rgba(0,0,0,0.08);
      --input-bg: #f1f5f9;
    }

    @media (prefers-color-scheme: light) {
      [data-theme="system"] {
        --bg: #f8fafc;
        --surface: #ffffff;
        --surface2: #f1f5f9;
        --surface-hover: #e2e8f0;
        --accent: #e94560;
        --text: #1e293b;
        --text-dim: #64748b;
        --text-muted: #94a3b8;
        --border: rgba(0,0,0,0.08);
        --input-bg: #f1f5f9;
      }
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .sidebar-header {
      padding: 20px 16px 12px;
      font-size: 18px;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-header span { color: #e94560; }

    .folder-tree { padding: 8px 0; flex: 1; }

    .tree-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-dim);
      transition: all 0.15s;
      user-select: none;
    }
    .tree-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
    .tree-item.active { background: rgba(233,69,96,0.15); color: #e94560; }
    .tree-item .icon { font-size: 14px; flex-shrink: 0; }
    .tree-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree-children { padding-left: 20px; }

    .sidebar-actions {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }
    .sidebar-actions button {
      flex: 1;
      padding: 6px 12px;
      background: var(--input-bg);
      border: none;
      border-radius: 6px;
      color: var(--text-dim);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .sidebar-actions button:hover { background: var(--input-bg); color: var(--text); }

    /* Main content */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .toolbar .breadcrumb {
      font-size: 14px;
      color: var(--text-dim);
      flex: 1;
    }
    .breadcrumb span { cursor: pointer; color: var(--text-dim); }
    .breadcrumb span:hover { color: var(--text); }
    .breadcrumb .sep { color: var(--text-muted); margin: 0 4px; }

    .search-box {
      position: relative;
      width: 280px;
    }
    .search-box input {
      width: 100%;
      padding: 6px 12px;
      padding-left: 30px;
      background: var(--input-bg);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    .search-box input:focus { border-color: #e94560; }
    .search-box input::placeholder { color: var(--text-muted); }
    .search-box .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 12px;
    }

    .toolbar button {
      padding: 6px 14px;
      background: var(--input-bg);
      border: none;
      border-radius: 6px;
      color: var(--text-dim);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .toolbar button:hover { background: var(--input-bg); color: var(--text); }
    .toolbar button.accent { background: #e94560; color: #fff; }
    .toolbar button.accent:hover { background: #d03050; }

    /* Bookmark list */
    .bookmark-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .bm-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
      user-select: none;
    }
    .bm-item:hover { background: rgba(255,255,255,0.05); }
    .bm-item .bm-icon { font-size: 16px; flex-shrink: 0; width: 20px; text-align: center; }
    .bm-item .bm-icon img { width: 16px; height: 16px; border-radius: 2px; vertical-align: middle; }
    .bm-item .bm-info { flex: 1; min-width: 0; }
    .bm-item .bm-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bm-item .bm-url { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .bm-item .bm-actions { display: none; gap: 4px; }
    .bm-item:hover .bm-actions { display: flex; }
    .bm-item .bm-actions button {
      padding: 3px 8px;
      background: rgba(255,255,255,0.08);
      border: none;
      border-radius: 4px;
      color: var(--text-dim);
      font-size: 11px;
      cursor: pointer;
    }
    .bm-item .bm-actions button:hover { color: var(--text); background: rgba(255,255,255,0.15); }
    .bm-item .bm-actions button.delete:hover { color: #e94560; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Edit dialog */
    .dialog-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 5000;
      align-items: center;
      justify-content: center;
    }
    .dialog-overlay.open { display: flex; }
    .dialog {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 24px;
      width: 420px;
      max-width: 90%;
    }
    .dialog h3 { font-size: 16px; margin-bottom: 16px; }
    .dialog label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 4px; }
    .dialog input {
      width: 100%;
      padding: 8px 12px;
      background: var(--input-bg);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      margin-bottom: 12px;
    }
    .dialog input:focus { border-color: #e94560; }
    .dialog-buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
    .dialog-buttons button {
      padding: 8px 20px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .dialog-buttons .btn-cancel { background: var(--input-bg); color: var(--text-dim); }
    .dialog-buttons .btn-cancel:hover { color: var(--text); }
    .dialog-buttons .btn-save { background: #e94560; color: #fff; }
    .dialog-buttons .btn-save:hover { background: #d03050; }
  </style>
</head>
<body>
  <!-- Sidebar: folder tree -->
  <div class="sidebar">
    <div class="sidebar-header"><span>B</span>ookmarks</div>
    <div class="folder-tree" id="folder-tree"></div>
    <div class="sidebar-actions">
      <button id="btn-new-folder">+ Folder</button>
      <button id="btn-import-chrome">Chrome Import</button>
    </div>
  </div>

  <!-- Main content -->
  <div class="main">
    <div class="toolbar">
      <div class="breadcrumb" id="breadcrumb"></div>
      <div class="search-box">
        <span class="search-icon">&#x1F50D;</span>
        <input type="text" id="search" placeholder="Search bookmarks...">
      </div>
      <button id="btn-add-bookmark" class="accent">+ Bookmark</button>
    </div>
    <div class="bookmark-list" id="bookmark-list"></div>
  </div>

  <!-- Edit dialog -->
  <div class="dialog-overlay" id="dialog-overlay">
    <div class="dialog">
      <h3 id="dialog-title">Edit</h3>
      <label>Name</label>
      <input type="text" id="dialog-name">
      <div id="dialog-url-group">
        <label>URL</label>
        <input type="text" id="dialog-url">
      </div>
      <div class="dialog-buttons">
        <button class="btn-cancel" id="btn-dialog-cancel">Cancel</button>
        <button class="btn-save" id="btn-dialog-save">Save</button>
      </div>
    </div>
  </div>

  <script src="js/api-auth.js"></script>
  <script src="js/pages/bookmarks.js"></script>
</body>
</html>
